name: Build Windows Test

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Disable updater artifacts
        shell: pwsh
        run: |
          node -e "
          const fs = require('fs');
          const p = 'src-tauri/tauri.conf.json';
          const c = JSON.parse(fs.readFileSync(p, 'utf8'));
          c.bundle.createUpdaterArtifacts = false;
          fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "

      - name: Build NyaTerm
        shell: pwsh
        run: pnpm exec tauri build --bundles nsis

      - name: Prepare portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path "artifacts/NyaTerm-portable/data" | Out-Null

          Copy-Item `
            "src-tauri/target/release/nyaterm.exe" `
            "artifacts/NyaTerm-portable/NyaTerm.exe"

          New-Item `
            -ItemType File `
            -Path "artifacts/NyaTerm-portable/portable.flag" `
            -Force | Out-Null

          New-Item `
            -ItemType File `
            -Path "artifacts/NyaTerm-portable/data/.keep" `
            -Force | Out-Null

          Compress-Archive `
            -Path "artifacts/NyaTerm-portable" `
            -DestinationPath "artifacts/NyaTerm-test-portable.zip" `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyaterm-windows-x64-test
          path: artifacts/*
          retention-days: 7